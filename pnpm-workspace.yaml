packages:
  - "apps/*"
  - "packages/*"
  - "infrastructure/*/*"

allowBuilds:
  core-js-pure: true
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - cf@1.0.0-beta.20

overrides:
  # Lighthouse's i18n pulls intl-messageformat, which needs tslib 2 helpers;
  # an older transitive tslib makes every performance audit error out.
  tslib: ^2.8.1
  # Same-major lifts for advisories published 2026-09: fast-uri (ajv in the MCP
  # SDK), undici (astro's unifont; wrangler's miniflare) and sharp (miniflare).
  fast-uri@3: ^3.1.8
  undici@8: ^8.10.2
  undici@7: ^7.29.1
  sharp@0: ^0.35.5
  # Same-major lifts for advisories published 2026-10: the MCP SDK (ext-apps
  # still allows the vulnerable 2.0; agents pins it exactly, so agents itself is
  # raised to 0.28.1 in apps/mcp-server), hono (@hono/node-server),
  # proxy-addr (express), http-cache-semantics (astro) and the lint tooling's
  # brace-expansion, source-map-js and postcss-selector-parser.
  "@modelcontextprotocol/sdk@1": ^1.32.1
  "@modelcontextprotocol/client@2": ^2.3.1
  "@modelcontextprotocol/server@2": ^2.3.1
  hono@4: ^4.13.11
  proxy-addr@2: ^2.0.8
  http-cache-semantics@4: ^4.2.1
  brace-expansion@5: ^5.0.12
  source-map-js@1: ^1.2.2
  postcss-selector-parser@7: ^7.1.6
