name: Analytics collect
on:
  schedule:
    - cron: "47 6 * * *" # 15:47 JST; availability still checked per source.
  workflow_dispatch:
    inputs:
      start:
        description: "Inclusive YYYY-MM-DD (both dates required for backfill, max 31 days)"
        type: string
      end:
        description: "Inclusive YYYY-MM-DD"
        type: string
permissions:
  contents: read
concurrency:
  group: diary-analytics-collect
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'tomoki013/tomokichi-diary' && github.ref == 'refs/heads/main' && vars.ANALYTICS_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: analytics
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --build
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.ANALYTICS_WIF_PROVIDER }}
          service_account: ${{ vars.ANALYTICS_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: tomokichidiary-analytics
      - name: Estimate bounded query scans
        env:
          ANALYTICS_START: ${{ inputs.start }}
          ANALYTICS_END: ${{ inputs.end }}
          ANALYTICS_GSC_PROPERTY: ${{ vars.ANALYTICS_GSC_PROPERTY || 'https://tomokichidiary.com/' }}
        run: pnpm exec tsx scripts/analytics/run.ts --dry-run
      - name: Collect and validate private aggregates
        env:
          ANALYTICS_ENABLED: "1"
          ANALYTICS_START: ${{ inputs.start }}
          ANALYTICS_END: ${{ inputs.end }}
          ANALYTICS_GSC_PROPERTY: ${{ vars.ANALYTICS_GSC_PROPERTY || 'https://tomokichidiary.com/' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.ANALYTICS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec tsx scripts/analytics/run.ts --persist
      # Private rows are deliberately never uploaded as Actions artifacts.
