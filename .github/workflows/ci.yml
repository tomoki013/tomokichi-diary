name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# CI carries no business logic: everything it runs is `pnpm run ci`, which
# behaves identically on a developer machine (see docs/ARCHITECTURE.md).
#
# CI checks; it does not ship. Releases are run by hand from a developer
# machine, where wrangler is already authenticated — the release sequence is
# the runbook in docs/OPERATIONS.md. That keeps production credentials out of
# the repository entirely: there is no CLOUDFLARE_API_TOKEN for a workflow, a
# pull request, or a dependency install script to reach.
jobs:
  ci:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: .cache/images
          key: image-derivatives-${{ hashFiles('export/media.json') }}
          restore-keys: image-derivatives-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-artifacts
          path: .artifacts/
          retention-days: 14
