name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      seed:
        description: "Also load export/ into D1 (pnpm db:seed) before deploying the API"
        type: boolean
        default: false
      full_media_sync:
        description: "Ignore the media upload manifest and re-send every object to R2"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# CI carries no business logic: everything it runs is `pnpm run ci`, which
# behaves identically on a developer machine (see docs/ARCHITECTURE.md).
#
# Deployment is a job in this same workflow, so it can only start from a green
# `ci` job on main. It runs the release sequence from docs/OPERATIONS.md. The
# Cloudflare credentials live in the `production` environment only (never in
# repository secrets), so pull request runs cannot read them, and each one is
# attached to the individual steps that talk to Cloudflare so that
# `pnpm install` and its install scripts never see it.
jobs:
  ci:
    name: Check
    runs-on: ubuntu-latest
    env:
      # Lighthouse only gates pull requests: main was measured by its PR, and
      # the deploy should not wait three minutes to learn the same thing.
      SKIP_PERF: ${{ github.event_name != 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR merge commit and its base, to see what the PR changes.
          fetch-depth: 2
      # A PR that touches nothing the public site is built from (tests, docs,
      # admin/api/mcp/chagee, migrations) cannot move a Lighthouse score.
      - name: Skip Lighthouse when the public site cannot change
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --name-only HEAD^1 HEAD \
            | grep -qvE '^(docs/|drafts/|migrations/|scripts/analytics/|apps/(admin|api|mcp-server|chagee)/)|\.md$|\.test\.ts$|/__tests__/'; then
            echo "SKIP_PERF=1" >> "$GITHUB_ENV"
          fi
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: .cache/images
          key: image-derivatives-${{ hashFiles('export/media.json') }}
          restore-keys: image-derivatives-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-artifacts
          path: .artifacts/
          # upload-artifact v4+ skips dot-directories unless told otherwise,
          # so without this the run uploaded nothing.
          include-hidden-files: true
          retention-days: 14

  deploy:
    name: Deploy
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      # The shipped artefacts must carry the production canonical URL and be
      # indexable; a build with the defaults is a noindex preview.
      PUBLIC_SITE_URL: https://tomokichidiary.com
      PUBLIC_INDEXABLE: "true"
      # Until the cutover (docs/RELEASE.md) the public Worker is only on
      # workers.dev; set the `VERIFY_URL` variable on the environment to
      # https://tomokichidiary.com once the domain points at it.
      VERIFY_URL: ${{ vars.VERIFY_URL || 'https://tomokichi-diary-web.tomoki-ttttt.workers.dev' }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache/restore@v6
        with:
          path: |
            .cache/images
            .cache/publication-originals
          key: publication-media-${{ runner.os }}-${{ hashFiles('scripts/media-build.ts', 'pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: publication-media-${{ runner.os }}-${{ hashFiles('scripts/media-build.ts', 'pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile

      # Migrations run ahead of the API that reads the new shape, so they must
      # stay backwards compatible (expand/contract, docs/OPERATIONS.md).
      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:migrate

      # Opt-in only: D1 is the source of truth and export/ is its snapshot, so
      # seeding is for the rare change made to export/ first (a batch edit
      # through the local tooling). The seed is an upsert and keeps rows the
      # export does not carry, such as likes.
      - name: Load export into the database
        if: github.event_name == 'workflow_dispatch' && inputs.seed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:seed

      - name: Build from the published content in D1
        id: content
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publication-step.mjs pull - remote pnpm exec tsx scripts/content-release.ts pull --force

      # Rebuilt here rather than reused from `ci`: what ships is built with the
      # production PUBLIC_* values above. Admin is built later with its own API
      # URL, and chagee is not deployed from here, so neither is built now.
      - name: Optimize required media
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MEDIA_BUILD_REMOTE: "1"
        run: node scripts/publication-step.mjs images images remote pnpm media:build
      - name: Build all applications for code deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publication-step.mjs code-build site local pnpm build:deploy
      - name: Validate published snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publication-step.mjs checks checks local pnpm content:check
      - name: Add publication marker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec tsx scripts/content-release.ts marker

      - name: Publish media to object storage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MEDIA_SYNC_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_media_sync && '1' || '' }}
        run: node scripts/publication-step.mjs r2-sync deploy remote pnpm media:sync

      - name: Deploy API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:api

      # The API goes first so the clients below never call an endpoint that is
      # not live yet. They do not depend on each other, so they go together;
      # each log is printed as its own group once it finishes.
      - name: Deploy MCP server, public site and admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deploy() {
            name=$1; shift
            # `|| status=$?` keeps bash -e from ending the job before the log prints.
            status=0; "$@" > ".artifacts/deploy-$name.log" 2>&1 || status=$?
            echo "::group::$name (exit $status)"; cat ".artifacts/deploy-$name.log"; echo "::endgroup::"
            return $status
          }
          mkdir -p .artifacts
          deploy mcp sh -c 'node scripts/publication-step.mjs mcp-deploy - remote pnpm --filter @tomokichi/mcp-server deploy:built && pnpm exec tsx scripts/content-release.ts mcp-deployed' & mcp=$!
          deploy web node scripts/publication-step.mjs web-deploy deploy remote pnpm deploy:web & web=$!
          deploy admin sh -c 'VITE_API_URL=/api pnpm --filter @tomokichi/admin build && pnpm deploy:admin' & admin=$!
          failed=0
          for pid in $mcp $web $admin; do wait $pid || failed=1; done
          exit $failed

      - name: Verify every legacy URL on the deployed site
        run: pnpm verify:live "$VERIFY_URL"

      - name: Confirm this publication is served
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publication-step.mjs verify verify remote pnpm exec tsx scripts/content-release.ts verify

      - name: Record successful publication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publication-step.mjs complete - remote pnpm exec tsx scripts/content-release.ts complete

      - name: Record failed publication
        if: failure() || cancelled()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec tsx scripts/content-release.ts fail

      - name: Save expanded media cache
        if: always() && steps.content.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/images
            .cache/publication-originals
          key: publication-media-${{ runner.os }}-${{ hashFiles('scripts/media-build.ts', 'pnpm-lock.yaml') }}-${{ steps.content.outputs.media_key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Collect publication timings
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publication-report.mjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-artifacts
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
