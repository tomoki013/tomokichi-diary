name: Analytics AdSense (optional)
on:
  schedule:
    - cron: "53 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diary-analytics-adsense
  cancel-in-progress: false
jobs:
  adsense:
    if: github.repository == 'tomoki013/tomokichi-diary' && github.ref == 'refs/heads/main' && vars.ANALYTICS_ENABLED == '1' && vars.ADSENSE_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: analytics
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --build
      - name: Read AdSense (failure does not block GA4/GSC)
        env:
          ANALYTICS_ENABLED: "1"
          ADSENSE_ENABLED: "1"
          ADSENSE_ACCOUNT: ${{ vars.ADSENSE_ACCOUNT }}
          ADSENSE_CLIENT_ID: ${{ secrets.ADSENSE_CLIENT_ID }}
          ADSENSE_CLIENT_SECRET: ${{ secrets.ADSENSE_CLIENT_SECRET }}
          ADSENSE_REFRESH_TOKEN: ${{ secrets.ADSENSE_REFRESH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.ANALYTICS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec tsx scripts/analytics/revenue.ts --persist
