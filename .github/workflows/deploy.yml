name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# Deployment carries no logic of its own: it runs the same `pnpm run ci` as
# every other branch, and only publishes if it passes.
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_SITE_URL: https://tomokichidiary.com
      PUBLIC_INDEXABLE: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Deploy API
        run: pnpm deploy:api

      - name: Deploy public site
        run: pnpm deploy:web

      - name: Deploy admin
        run: pnpm deploy:admin

      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ci-artifacts
          path: .artifacts/
          retention-days: 14
