name: Publish content
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Publication request (the build always takes the latest D1 state)"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      PUBLIC_SITE_URL: https://tomokichidiary.com
      PUBLIC_INDEXABLE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .cache/images
          key: image-derivatives-${{ hashFiles('export/media.json') }}
          restore-keys: image-derivatives-
      - name: Pull the latest published revisions and uploaded photos
        id: content
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec tsx scripts/content-release.ts pull
      - if: steps.content.outputs.changed == 'true'
        run: pnpm media:build && pnpm build && pnpm check:routes && pnpm check:seo && pnpm check:links && pnpm check:knowledge
      - if: steps.content.outputs.changed == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .cache/r2-manifest.json
          key: r2-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-manifest-
      - name: Publish photos, site, and MCP
        if: steps.content.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm media:sync && pnpm deploy:web && pnpm deploy:mcp
      - name: Record successful publication
        if: steps.content.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec tsx scripts/content-release.ts complete
      - name: Record a failed publication
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec tsx scripts/content-release.ts fail
      - if: always() && hashFiles('.cache/r2-manifest.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .cache/r2-manifest.json
          key: r2-manifest-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publication
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
