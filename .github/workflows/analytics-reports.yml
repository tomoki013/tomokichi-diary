name: Analytics period reports
# "Analytics collect" saves each completed week and month once, after
# collection. This rebuilds a report on request (it overwrites the saved one).
on:
  workflow_dispatch:
    inputs:
      period:
        type: choice
        options: [weekly, monthly]
        default: weekly
permissions:
  contents: read
concurrency:
  group: diary-analytics-reports
  cancel-in-progress: false
jobs:
  report:
    if: github.repository == 'tomoki013/tomokichi-diary' && github.ref == 'refs/heads/main' && vars.ANALYTICS_ENABLED == '1'
    environment: analytics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --build
      - name: Build report from private D1 (no BigQuery scans)
        env:
          REPORT_PERIOD: ${{ inputs.period }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.ANALYTICS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec tsx scripts/analytics/report.ts "$REPORT_PERIOD"
