name: Analytics period reports
on:
  schedule:
    - cron: "17 7 * * 1" # Monday 16:17 JST, previous completed week
    - cron: "37 7 1 * *" # 16:37 JST, previous calendar month
  workflow_dispatch:
    inputs:
      period:
        type: choice
        options: [weekly, monthly]
        default: weekly
permissions:
  contents: read
concurrency:
  group: diary-analytics-reports
  cancel-in-progress: false
jobs:
  report:
    if: github.repository == 'tomoki013/tomokichi-diary' && github.ref == 'refs/heads/main' && vars.ANALYTICS_ENABLED == '1'
    environment: analytics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --build
      - name: Build report from private D1 (no BigQuery scans)
        env:
          REPORT_PERIOD: ${{ inputs.period || (github.event.schedule == '37 7 1 * *' && 'monthly' || 'weekly') }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.ANALYTICS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec tsx scripts/analytics/report.ts "$REPORT_PERIOD"
