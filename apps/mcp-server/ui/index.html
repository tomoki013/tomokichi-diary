<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>旅の根拠ビュー</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        background: Canvas;
        color: CanvasText;
      }
      header {
        margin-bottom: 14px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.15rem;
      }
      #status {
        opacity: 0.7;
        font-size: 0.85rem;
      }
      #items {
        display: grid;
        gap: 10px;
      }
      article {
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 12px;
        padding: 12px;
      }
      h2 {
        margin: 0 0 6px;
        font-size: 1rem;
      }
      p {
        margin: 4px 0;
        line-height: 1.55;
      }
      ul {
        margin: 8px 0 0;
        padding-left: 20px;
      }
      small {
        opacity: 0.72;
      }
      a {
        color: LinkText;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>旅の根拠ビュー</h1>
      <div id="status">結果を読み込んでいます…</div>
    </header>
    <main id="items"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
